<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} {{ title }} | Recluse</title>
    <link rel="icon" type="image/png" href="{{ bot_avatar }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#09090e] text-zinc-100 min-h-screen flex items-center justify-center p-6 font-sans relative">
    <div class="max-w-md w-full bg-[#14151c]/90 backdrop-blur-2xl border border-white/15 rounded-3xl p-8 text-center shadow-2xl">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-red-500/15 border border-red-500/30 flex items-center justify-center mb-5">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-2xl"></i>
        </div>
        <div class="text-xs font-mono text-zinc-400 uppercase tracking-widest mb-1">HTTP {{ status_code }}</div>
        <h1 class="text-2xl font-extrabold text-white mb-3">{{ title }}</h1>
        <p class="text-sm text-zinc-300 mb-6 leading-relaxed">{{ message }}</p>
        <div class="flex items-center justify-center gap-3">
            <a href="/" class="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 border border-white/15 text-sm font-bold text-white transition">
                Return Home
            </a>
            {% if show_login %}
            <a href="/login" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-sm font-bold text-white transition">
                Log In
            </a>
            {% endif %}
        </div>
    </div>
</body>
</html>
